# .github/workflows/actions.lock がワークフローの uses: と食い違っていないか、
# 記録したコミットが上流で今も検証できるかを確かめる。
# uses: を追加・変更したら `gh actions-lock` を実行してロックファイルを更新する。

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main
  # タグが別のコミットへ付け替えられた場合に気づけるよう、週に一度も検証する。
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
